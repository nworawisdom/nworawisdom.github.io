<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TokSave - TikTok Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #080808, #151515, #050505);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #ff0050;
    }

    .subtitle {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 35px;
    }

    .box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .input-area {
      display: flex;
      gap: 8px;
      background: #222;
      padding: 7px;
      border-radius: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      padding: 12px;
      font-size: 14px;
    }

    input::placeholder {
      color: #777;
    }

    .paste-btn {
      background: #333;
      color: white;
      border: none;
      border-radius: 9px;
      padding: 0 13px;
      cursor: pointer;
    }

    .download-btn {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff0050, #ff1744);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .download-btn:active {
      transform: scale(0.97);
    }

    .message {
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
      color: #aaa;
    }

    .loader {
      display: none;
      width: 28px;
      height: 28px;
      border: 3px solid #444;
      border-top: 3px solid #ff0050;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 18px auto 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .features {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      color: #999;
      font-size: 12px;
    }

    .feature {
      max-width: 100px;
    }

    .icon {
      font-size: 23px;
      margin-bottom: 7px;
    }

    footer {
      margin-top: 30px;
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Tok<span>Save</span>
    </div>

    <p class="subtitle">
      Download TikTok videos easily
    </p>

    <div class="box">

      <div class="input-area">

        <input
          type="text"
          id="url"
          placeholder="Paste TikTok video link..."
        >

        <button class="paste-btn" onclick="pasteLink()">
          Paste
        </button>

      </div>

      <button class="download-btn" onclick="downloadVideo()">
        Download Video
      </button>

      <div class="loader" id="loader"></div>

      <div class="message" id="message"></div>

    </div>

    <div class="features">

      <div class="feature">
        <div class="icon">⚡</div>
        Fast
      </div>

      <div class="feature">
        <div class="icon">📱</div>
        Mobile Friendly
      </div>

      <div class="feature">
        <div class="icon">🔗</div>
        Easy To Use
      </div>

    </div>

    <footer>
      © 2026 TokSave
    </footer>

  </div>


  <script>

    async function pasteLink() {

      try {

        const text = await navigator.clipboard.readText();

        document.getElementById("url").value = text;

      } catch (error) {

        document.getElementById("message").innerText =
          "Please paste the link manually.";

      }

    }


    function downloadVideo() {

      const url = document.getElementById("url").value.trim();

      const message = document.getElementById("message");
      const loader = document.getElementById("loader");

      if (url === "") {

        message.innerText = "Please enter a TikTok link.";
        return;

      }

      if (!url.includes("tiktok.com")) {

        message.innerText = "Please enter a valid TikTok link.";
        return;

      }

      message.innerText = "Processing video...";
      loader.style.display = "block";

      /*
        FRONT-END DEMO ONLY

        A real downloader needs a backend/API here.
      */

      setTimeout(() => {

        loader.style.display = "none";

        message.innerText =
          "Frontend is working! Connect a downloader API to enable the actual download.";

      }, 1800);

    }

  </script>

</body>
</html>
