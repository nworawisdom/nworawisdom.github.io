<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1b2a1e;
    font-family: Arial, Helvetica, sans-serif;
    color: #eee;
    touch-action: none;
  }
  h1 { margin-bottom: 8px; }
  #scoreboard { margin-bottom: 10px; font-size: 18px; }
  canvas {
    background: #0e1a10;
    border: 4px solid #5a7d4a;
    border-radius: 8px;
  }
  #message {
    margin-top: 12px;
    font-size: 16px;
    min-height: 24px;
    text-align: center;
  }
  button {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 16px;
    background: #4caf50;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #43a047; }
  #controls-hint {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Snake</h1>
<div id="scoreboard">Score: <span id="score">0</span> &nbsp;|&nbsp; Best: <span id="best">0</span></div>
<canvas id="game" width="400" height="400"></canvas>
<div id="message"></div>
<button id="restartBtn">Restart</button>
<div id="controls-hint">Use Arrow Keys or WASD to move. On mobile, swipe on the board.</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const gridSize = 20;
  const tileCount = canvas.width / gridSize;
  const moveInterval = 100; // ms per grid step

  let snake, direction, nextDirection, food, score, best, gameOver;
  let lastMoveTime = 0;
  let animId = null;
  let foodPulse = 0;

  best = parseInt(localStorage.getItem('snakeBest') || '0', 10);
  document.getElementById('best').textContent = best;

  function init() {
    snake = [
      { x: 10, y: 10, px: 10, py: 10 },
      { x: 9,  y: 10, px: 9,  py: 10 },
      { x: 8,  y: 10, px: 8,  py: 10 }
    ];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    gameOver = false;
    lastMoveTime = performance.now();
    document.getElementById('score').textContent = score;
    document.getElementById('message').textContent = '';
    placeFood();
    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  function placeFood() {
    let valid = false;
    while (!valid) {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
    }
  }

  function step() {
    direction = nextDirection;
    if (direction.x === 0 && direction.y === 0) return;

    const head = snake[0];
    const newHead = {
      x: head.x + direction.x,
      y: head.y + direction.y,
      px: head.x,
      py: head.y
    };

    if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
      return endGame();
    }
    if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
      return endGame();
    }

    snake.unshift(newHead);

    if (newHead.x === food.x && newHead.y === food.y) {
      score++;
      document.getElementById('score').textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    gameOver = true;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      document.getElementById('best').textContent = best;
      document.getElementById('message').textContent = 'New best score! Game over — press Restart.';
    } else {
      document.getElementById('message').textContent = 'Game over — press Restart.';
    }
  }

  function loop(now) {
    if (!gameOver) {
      const elapsed = now - lastMoveTime;
      if (elapsed >= moveInterval) {
        snake.forEach(seg => { seg.px = seg.x; seg.py = seg.y; });
        step();
        lastMoveTime = now;
      }
      const t = Math.min(1, (now - lastMoveTime) / moveInterval);
      foodPulse = (Math.sin(now / 200) + 1) / 2;
      draw(t);
      animId = requestAnimationFrame(loop);
    }
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function draw(t) {
    ctx.fillStyle = '#0e1a10';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    for (let y = 0; y < tileCount; y++) {
      for (let x = 0; x < tileCount; x++) {
        if ((x + y) % 2 === 0) {
          ctx.fillRect(x * gridSize, y * gridSize, gridSize, gridSize);
        }
      }
    }

    const points = snake.map(seg => ({
      x: lerp(seg.px, seg.x, t) * gridSize + gridSize / 2,
      y: lerp(seg.py, seg.y, t) * gridSize + gridSize / 2
    }));

    const fx = food.x * gridSize + gridSize / 2;
    const fy = food.y * gridSize + gridSize / 2;
    const foodR = gridSize / 2 - 3 + foodPulse * 1.5;
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.arc(fx, fy, foodR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(fx - foodR * 0.35, fy - foodR * 0.35, foodR * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3d8b3d';
    ctx.fillRect(fx - 1.5, fy - foodR - 4, 3, 5);

    if (points.length > 1) {
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = points.length - 1; i > 0; i--) {
        const p0 = points[i];
        const p1 = points[i - 1];
        const widthFactor = 1 - (i / points.length) * 0.55;
        const w = (gridSize - 4) * widthFactor;
        ctx.strokeStyle = `hsl(96, 45%, ${28 + (i % 2 === 0 ? 3 : 0)}%)`;
        ctx.lineWidth = Math.max(4, w);
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        const mx = (p0.x + p1.x) / 2;
        const my = (p0.y + p1.y) / 2;
        ctx.quadraticCurveTo(p0.x, p0.y, mx, my);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();

        if (i % 2 === 0) {
          ctx.fillStyle = 'rgba(0,0,0,0.12)';
          ctx.beginPath();
          ctx.ellipse(p0.x, p0.y, w * 0.28, w * 0.18, Math.atan2(p1.y - p0.y, p1.x - p0.x), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const head = points[0];
      const neck = points[1];
      const angle = Math.atan2(head.y - neck.y, head.x - neck.x);
      const headR = gridSize / 2 - 1;

      ctx.fillStyle = '#4a7c3c';
      ctx.beginPath();
      ctx.ellipse(head.x, head.y, headR, headR * 0.82, angle, 0, Math.PI * 2);
      ctx.fill();

      if (direction.x !== 0 || direction.y !== 0) {
        const flick = Math.sin(performance.now() / 90) > 0.3;
        if (flick) {
          const tx = head.x + Math.cos(angle) * (headR + 8);
          const ty = head.y + Math.sin(angle) * (headR + 8);
          const forkSpread = 3;
          const perp = angle + Math.PI / 2;
          ctx.strokeStyle = '#c94f4f';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(head.x + Math.cos(angle) * headR, head.y + Math.sin(angle) * headR);
          ctx.lineTo(tx, ty);
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + Math.cos(angle) * 3 + Math.cos(perp) * forkSpread, ty + Math.sin(angle) * 3 + Math.sin(perp) * forkSpread);
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx + Math.cos(angle) * 3 - Math.cos(perp) * forkSpread, ty + Math.sin(angle) * 3 - Math.sin(perp) * forkSpread);
          ctx.stroke();
        }
      }

      const eyeOffsetForward = headR * 0.35;
      const eyeOffsetSide = headR * 0.55;
      const perp = angle + Math.PI / 2;
      [1, -1].forEach(side => {
        const ex = head.x + Math.cos(angle) * eyeOffsetForward + Math.cos(perp) * eyeOffsetSide * side;
        const ey = head.y + Math.sin(angle) * eyeOffsetForward + Math.sin(perp) * eyeOffsetSide * side;
        ctx.fillStyle = '#fdf6e3';
        ctx.beginPath();
        ctx.arc(ex, ey, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(ex + Math.cos(angle) * 1, ey + Math.sin(angle) * 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }

  function setDirection(x, y) {
    if (snake.length > 1 && direction.x === -x && direction.y === -y) return;
    nextDirection = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
      case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
      case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
    }
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy > 0 ? 1 : -1);
    }
    e.preventDefault();
  }, { passive: false });

  document.getElementById('restartBtn').addEventListener('click', init);

  init();
})();
</script>

</body>
</html>
